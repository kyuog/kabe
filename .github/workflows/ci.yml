name: Kabe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar GTK3 y PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 libgtk-3-0
      - name: Ejecutar las pruebas
        run: python3 -m unittest discover -s tests -t . -v

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir el sitio
        run: python3 tools/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: dist/site
          retention-days: 7

  paquete:
    name: Paquete .deb
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Construir el .deb
        run: ./packaging/build_deb.sh
      - name: Comprobar el paquete
        run: dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: kabe-deb
          path: dist/*.deb

  publicacion:
    name: PublicarRelease
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [pruebas, paquete]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Construir el .deb
        run: ./packaging/build_deb.sh
      - name: Crear la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
